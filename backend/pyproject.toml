[project]
name = "simp"
version = "0.1.0"
description = "SIMP - Simulated Investment Manager Platform: core library, engine, analytics, API and CLI"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1,<3",
  "polars>=1.20,<2",
  "pandas>=2.2,<2.3",
  "pyarrow>=18",
  "duckdb>=1.1,<2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "sse-starlette>=2.1,<3",
  "typer>=0.13,<1",
  "dramatiq[redis]>=1.17,<2",
  "redis>=5.2,<6",
  "structlog>=24.4",
  "pyyaml>=6.0.2",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2",
]

[project.optional-dependencies]
wrds = ["wrds>=3.5.0"]

[project.scripts]
simp = "simp.cli.main:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "hypothesis>=6.120",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simp"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "S110", "T20"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]
"simp/cli/**" = ["T20"]
"scripts/**" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: full-window runs", "golden: requires handoff CSVs"]

[tool.coverage.run]
source = ["simp"]
